services:
  # -------------------------------------------------------
  # PHP 8.4 FPM Application
  # -------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: croma_app
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - .:/var/www
      - /var/www/vendor
      - app_storage:/var/www/storage
    healthcheck:
      test: ["CMD-SHELL", "cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - croma_network

  # -------------------------------------------------------
  # Background Queue Worker Process
  # -------------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: croma_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=120", "--sleep=3"]
    env_file:
      - .env.docker
    environment:
      - RUN_MIGRATIONS=false
    volumes:
      - .:/var/www
      - /var/www/vendor
      - app_storage:/var/www/storage
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - croma_network

  # -------------------------------------------------------
  # Nginx Web Server
  # -------------------------------------------------------
  web:
    image: nginx:alpine
    container_name: croma_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www:ro
      - /var/www/vendor
      - app_storage:/var/www/storage:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      app:
        condition: service_healthy
    networks:
      - croma_network

  # -------------------------------------------------------
  # MySQL 8.0 Database
  # -------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: croma_db
    restart: unless-stopped
    command: --max_connections=500 --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: sisfor_croma_music
      MYSQL_USER: croma_user
      MYSQL_PASSWORD: croma_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - croma_network

volumes:
  db_data:
    driver: local
  app_storage:
    driver: local

networks:
  croma_network:
    driver: bridge
