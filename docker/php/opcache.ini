; PHP 8.4 OPcache - Production Settings for Laravel

[opcache]
opcache.enable=1
opcache.enable_cli=0

; Memory for caching compiled scripts
opcache.memory_consumption=256

; Memory for interned strings
opcache.interned_strings_buffer=16

; Max number of cached files
opcache.max_accelerated_files=20000

; Validate script timestamps (disable for production to skip disk I/O)
opcache.validate_timestamps=0

; How often to check for changes (seconds); only relevant when validate_timestamps=1
opcache.revalidate_freq=0

; Enable JIT compilation (PHP 8.4 supports JIT out of the box)
opcache.jit=tracing
opcache.jit_buffer_size=100M

; Save compiled scripts between requests
opcache.fast_shutdown=1
